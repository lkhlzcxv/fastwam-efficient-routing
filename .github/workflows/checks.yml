name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check archived aggregates and routing rules
        run: python -m unittest discover -s tests -v
      - name: Print reported results
        run: python scripts/summarize_results.py
      - name: Run synthetic routing illustration
        run: python examples/route_demo.py
